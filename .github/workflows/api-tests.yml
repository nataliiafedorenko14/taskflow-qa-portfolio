# CI: run the API test suite on every push to main and on pull requests.
# Public repos get unlimited free runner minutes.
name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allows a manual run from the Actions tab

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the repository onto the runner.
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. Install Python on the runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # caches pip downloads between runs -> faster CI

      # 3. Install backend + test dependencies.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the API test suite (pytest exits non-zero on failure -> red job).
      - name: Run API tests
        working-directory: server
        run: pytest -v
